name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Build self-contained universal app
        run: ./scripts/package_release.sh
      - name: Smoke test bundled runtimes
        run: |
          app="dist/Replay.app"
          file "$app/Contents/MacOS/Replay"
          "$app/Contents/Resources/Tools/yt-dlp" --version
          "$app/Contents/Resources/Tools/ffmpeg" -version | head -1
          "$app/Contents/Resources/Tools/deno" --version | head -1
          codesign --verify --deep --strict "$app"
      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Replay-macOS.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Replay-macOS.zip
            dist/Replay-macOS.zip.sha256
