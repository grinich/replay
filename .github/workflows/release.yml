name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGNING_IDENTITY: "Developer ID Application: Michael Grinich (${{ secrets.APPLE_TEAM_ID }})"
      RELEASE_KEYCHAIN_NAME: replay-release.keychain-db
      RELEASE_KEYCHAIN_PASSWORD: replay-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "${GITHUB_REF_NAME}"
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          release_keychain="$RUNNER_TEMP/$RELEASE_KEYCHAIN_NAME"
          echo "RELEASE_KEYCHAIN=$release_keychain" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$release_keychain"
          security set-keychain-settings -lut 21600 "$release_keychain"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$release_keychain"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$release_keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$RELEASE_KEYCHAIN_PASSWORD" \
            "$release_keychain"
          security list-keychains -d user -s "$release_keychain"
          security find-identity -v -p codesigning "$release_keychain" | grep -F "$SIGNING_IDENTITY"
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          xcrun notarytool store-credentials replay-ci \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$RELEASE_KEYCHAIN"
      - name: Build, sign, notarize, and package release
        env:
          REPLAY_SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          REPLAY_NOTARIZE: "1"
          REPLAY_NOTARY_PROFILE: replay-ci
          REPLAY_NOTARY_KEYCHAIN: ${{ env.RELEASE_KEYCHAIN }}
        run: ./scripts/package_release.sh
      - name: Smoke test bundled runtimes
        run: |
          app="dist/Replay.app"
          file "$app/Contents/MacOS/Replay"
          file "$app/Contents/Helpers/ReplayUpdater"
          "$app/Contents/Resources/Tools/yt-dlp" --version
          "$app/Contents/Resources/Tools/ffmpeg" -version | head -1
          "$app/Contents/Resources/Tools/deno" --version | head -1
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -F "$SIGNING_IDENTITY"
          xcrun stapler validate "$app"
          xcrun stapler validate dist/Replay.dmg
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/Replay.dmg
      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Replay-macOS.zip
      - name: Attest DMG installer
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Replay.dmg
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Replay-macOS.zip
            dist/Replay-macOS.zip.sha256
            dist/Replay.dmg
            dist/Replay.dmg.sha256
      - name: Delete temporary release keychain
        if: always()
        run: security delete-keychain "$RELEASE_KEYCHAIN" || true
